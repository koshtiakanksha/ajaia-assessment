# Render Blueprint: one Docker web service + a Postgres database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: ajaia-docs
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY        # signs session cookies; generated once by Render
        generateValue: true
      - key: COOKIE_SECURE     # session cookie only over HTTPS
        value: "1"
      - key: SEED_DEMO_DATA    # demo users + sample shared docs on first start
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: ajaia-docs-db
          property: connectionString

databases:
  - name: ajaia-docs-db
    plan: free
    databaseName: ajaia_docs
    user: ajaia
